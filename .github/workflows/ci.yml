name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # The invariant that guards everything else (PLAN §5.2). Run on its own so
      # that when it breaks, the log says so rather than burying it among the
      # rest.
      - name: identity map is byte-identical
        run: go test ./internal/rewrite/ -run 'TestIdentityMap|TestIdentityHolds' -v

      - run: go test ./... -race

      # The add-on command is shell and holds the opinions the binary refuses
      # to: the slug, which checkout the map comes from, which hostnames web
      # keeps. It needs no Docker and no DDEV, so it belongs here rather than in
      # the e2e job that takes twenty minutes.
      - name: the add-on command
        run: make test-addon

      - name: build for every target platform
        run: make dist

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only. Publishing is release.yml's job, on a tag; this asserts the
      # Dockerfile still builds on every PR, which is where it would break.
      - run: docker build -t hostshift:ci .

  # DDEV end to end: a parent checkout, a git worktree, the add-on, the router.
  #
  # This is the layer three defects walked straight through in one day, each of
  # them green in every other suite: a post-start hook that exited 127 on every
  # start because nothing ran the hook body, a `--map` form the *published* image
  # parses as one pair because nothing ran the published image, and a `check`
  # that certified both as correct. It asserts what DDEV serves, not what the
  # host command writes.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: build the image this PR would ship
        run: docker build -t hostshift:ci .

      - name: worktrees end to end
        env:
          HOSTSHIFT_IMAGE: hostshift:ci
        run: test/integration-ddev.sh

      # The compose file is not versioned with the image it names, and asking the
      # published binary for a flag form it does not have has broken every
      # project twice now — once with `--map ""`, once with a comma-separated
      # `--map`. Both were invisible because CI only ever ran its own build. So
      # assert the published image understands the exact shape the add-on emits.
      - name: the published image still understands what the add-on emits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          published=ghcr.io/generoi/hostshift:latest
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The package is private, and a fork's token cannot read it. That is
          # not skew, so do not fail the build for it — but say so, loudly enough
          # that a real regression is never mistaken for this.
          if ! docker pull -q "$published"; then
            echo "::warning::cannot pull $published here; the compose file's flag" \
                 "contract against the published image was NOT verified in this run"
            exit 0
          fi
          # A two-site map, the shape that 421'd everything when it was commas.
          docker run --rm "$published" map \
            --from https://a.example --to https://wt--a.example \
            --from https://b.example --to https://wt--b.example \
            | tee /dev/stderr | grep -q 'https://wt--b.example'
          # And with no map flags at all, which is what a project with a
          # hostshift.yaml passes.
          docker run --rm "$published" map --help >/dev/null

  # The acceptance suite against a WordPress that this job builds from nothing.
  #
  # internal/e2e can be pointed at any project, but it skips unless the variant
  # host is set — so for most of this project's life it ran against exactly one
  # machine's copy of herrfors, and never in CI. Both of the add-on bugs the M6
  # audit found were in the install path, which is the part only a from-scratch
  # project exercises.
  #
  # The canonical hostnames use the reserved .test TLD, so nothing here can
  # reach a real site even if loopback containment broke.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # autostart: false — bootstrap-ddev.sh runs `ddev config` itself, in a
      # directory it creates.
      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: build the CLI the bootstrap uses
        run: make build

      # The bootstrap builds the container image itself, from this checkout —
      # see the comment there. Nothing in this job pulls a published image, so
      # the suite tests the code in the PR rather than the last release.

      - name: bootstrap a stock DDEV multisite and run the suite
        env:
          HOSTSHIFT_TEST_ROOT: ${{ runner.temp }}/hostshift-e2e
        run: test/bootstrap-ddev.sh up

      - name: ddev logs on failure
        if: failure()
        env:
          HOSTSHIFT_TEST_ROOT: ${{ runner.temp }}/hostshift-e2e
        run: |
          cd "$HOSTSHIFT_TEST_ROOT" || exit 0
          ddev logs -s web  --tail 200 || true
          ddev logs -s hostshift --tail 200 || true
          ddev describe || true
