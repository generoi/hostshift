name: Release

# The DDEV add-on's compose service names ghcr.io/generoi/hostshift, so until
# something publishes it the add-on only works on a machine that has built the
# image locally. This is that something.
#
# Tag-driven: pushing v0.1.0 publishes :v0.1.0 and moves :latest. The workflow
# can also be run by hand against a ref, which publishes the version but leaves
# :latest where it is — useful for trying a build in a worktree without moving
# what every project's add-on pulls.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0-rc1). :latest is not moved.'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # The image is what the add-on pulls, so it is not published unless the suite
  # that guards it is green — including the identity invariant on its own, so a
  # failure there is legible in the log rather than buried.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: identity map is byte-identical
        run: go test ./internal/rewrite/ -run 'TestIdentityMap|TestIdentityHolds' -v
      - run: go test ./... -race

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # linux/amd64 and linux/arm64: the DDEV web container runs on both, and an
      # Apple-silicon developer pulling an amd64-only image gets emulation or a
      # manifest error rather than a proxy.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          # :latest moves only for a real tag. A dispatch run is for trying a
          # build, and every project's add-on pulls :latest.
          tags: |
            ghcr.io/generoi/hostshift:${{ steps.v.outputs.version }}
            ${{ startsWith(github.ref, 'refs/tags/') && 'ghcr.io/generoi/hostshift:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The version stamp is easy to break silently: -X naming a variable that
      # does not exist is ignored by the linker, and the binary then reports
      # "dev" forever. Assert it on the image that was actually pushed.
      - name: the published image reports its version
        run: |
          got=$(docker run --rm --entrypoint /hostshift \
            ghcr.io/generoi/hostshift:${{ steps.v.outputs.version }} version)
          echo "image reports: $got"
          [ "$got" = "${{ steps.v.outputs.version }}" ] || {
            echo "version stamp did not land: want ${{ steps.v.outputs.version }}"; exit 1; }

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make dist stamps the version from git describe
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: make dist VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/hostshift-*
          generate_release_notes: true
