#ddev-generated
# hostshift — say what is being served, and notice when it has gone stale.
#
# Installed by `ddev add-on get`, not written per worktree, so it carries none of
# the regeneration hazards a generated config file would. It declares no
# hostnames and nothing else DDEV merges into the project's configuration; it is
# here for the hook alone.
#
# The hook delegates rather than reimplementing. An earlier version sourced
# `.ddev/.env` with `.` to read the variables itself, which was wrong twice: that
# file is dotenv, where values are literal, and sourcing it makes them *code* on
# the developer's machine — `APP_SECRET=$(...)` in a project file became host
# execution on every `ddev start`. It also broke outright the moment a value
# contained a space, which HOSTSHIFT_MAP_ARGS always does, so it failed with exit
# 127 on exactly the zero-config path the README leads with.
#
# `ddev hostshift check` already answers the question, reads the file by parsing
# rather than sourcing, and cannot disagree with itself the way two separate
# staleness checks did. No `|| true`: DDEV does not fail `ddev start` on a failing
# `exec-host` anyway — measured, it prints `Task failed:` and still reports
# success — so all the guard did was suppress the one line that made a stale
# configuration visible above the rest of the start output.
#
# An environment variable rather than a flag, and that is the whole point.
#
# This file carries #ddev-generated, so `ddev add-on get` replaces it on upgrade.
# The command it calls only gained that marker *after* v0.1.0, so DDEV refuses to
# replace that one — an upgraded project runs this new hook against the old
# command, whose parser exits 2 on any flag it does not know. Measured on a real
# upgrade: `unknown argument: --quiet`, `Task failed`, `Successfully started`.
# The proxy kept serving, so nothing looked wrong, and the post-start check was
# dead from then on. Every later drift went unreported on exactly the projects
# that had been running longest.
#
# DDEV runs this line through `bash -c` (pkg/ddevapp/task.go, ExecHostTask), so
# the prefix is an ordinary assignment, and a command that only reads "$@" cannot
# trip over it. The rule stated in the compose file — anything added here must
# work against what is already deployed — applies to the hook line too.
#
# What it buys: a project that has the add-on installed but has never been
# configured says nothing at all on start. It has nothing to check, and nine
# lines of advice plus a `Task failed` on a project with nothing wrong with it is
# how an add-on stops being inert until it is configured.
hooks:
  post-start:
    - exec-host: HOSTSHIFT_HOOK=1 .ddev/commands/host/hostshift check
