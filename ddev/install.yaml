name: hostshift

# Serve a site from a hostname other than the one in its database, without
# rewriting the database.
#
# The add-on is a compose service, the loopback override, and one host command.
# The command is where the DDEV- and stack-shaped opinions live — deriving a slug
# from a branch, deciding which hostnames web keeps, writing .ddev/ files — so
# that the binary can stay a general origin mapper that scaffolds nothing.
# PLAN §5.7. There are still no hooks and no guard.

pre_install_actions:
  - |
    #ddev-nodisplay
    if ! command -v hostshift >/dev/null 2>&1; then
      echo "note: the hostshift CLI is not on PATH." >&2
      echo "The proxy itself runs from the container image, so the add-on works" >&2
      echo "without it, but 'ddev hostshift' and 'hostshift map|check|diff' need it." >&2
    fi

# Ignore what this add-on installs, in the checkout rather than in a commit.
#
# A .gitignore block is *branch*-scoped: adopt hostshift on one branch and every
# pre-existing branch still shows the add-on's files as untracked, which is where
# `git add -A` commits them. $GIT_COMMON_DIR/info/exclude is checkout-scoped,
# which is the right scope for machine-local tool files, and it is shared by a
# repository and all its linked worktrees — so one write covers them all, on
# every branch, and the repo commits nothing.
#
# Deliberately not the root hostshift.yaml, which is a project's own committed
# statement about its hostnames.
  - |
    #ddev-nodisplay
    # `|| true` inside the substitution: DDEV runs actions under `set -eu -o
    # pipefail`, git rev-parse exits 128 outside a repository, and the assignment
    # inherits that — which aborted the whole install and left the project with
    # nothing, in any .ddev project that is not a git checkout.
    common="$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null || true)"
    [ -n "$common" ] || exit 0
    ex="$common/info/exclude"
    [ -d "$(dirname "$ex")" ] || exit 0
    # A delimited block, so removal can take back exactly what install put in.
    #
    # Removal used to `grep -vxF` each pattern, which deletes *every* matching
    # line — including one the developer had written themselves. Both pilot
    # repos had added `.ddev/.env` by hand before the add-on existed, so
    # uninstalling took away their own rule and left the credentials file
    # untracked and un-ignored: the exact exposure the block exists to prevent,
    # in a single-checkout project with no worktrees in sight.
    #
    # The end marker also means a later version can add a pattern to the block
    # rather than being frozen by the idempotency guard below.
    # A complete block is left alone; a half-written one is repaired rather than
    # frozen, since the idempotency guard would otherwise arm that trap forever.
    if grep -qxF '# hostshift (ddev add-on) — begin' "$ex" 2>/dev/null; then
      if grep -qxF '# hostshift (ddev add-on) — end' "$ex"; then
        exit 0
      fi
      tmp="$(mktemp)"
      awk '
        $0 == "# hostshift (ddev add-on) — begin" { drop = 1; next }
        drop && ($0 == ".ddev/**/*hostshift*" || $0 == ".ddev/.env" || $0 == "wp-cli.local.yml") { next }
        { drop = 0; print }
      ' "$ex" > "$tmp" && cat "$tmp" > "$ex"
      rm -f "$tmp"
    fi
    # An older, undelimited block from a previous version: take it out first, so
    # this does not append a second copy beside it.
    #
    # Only the *contiguous* run that follows the marker. `grep -vxF` removed
    # every matching line anywhere in the file, so a developer's own
    # `.ddev/.env` rule written above the block — the shape this file's comments
    # say both pilot repos have — was deleted from their own section and
    # absorbed into ours, and the next removal then took it away for good. That
    # is the exposure the markers were introduced to prevent, reintroduced one
    # release later through the migration.
    if grep -qxF '# hostshift (ddev add-on)' "$ex" 2>/dev/null; then
      tmp="$(mktemp)"
      awk '
        $0 == "# hostshift (ddev add-on)" { drop = 1; next }
        drop && ($0 == ".ddev/**/*hostshift*" || $0 == ".ddev/.env" || $0 == "wp-cli.local.yml") { next }
        { drop = 0; print }
      ' "$ex" > "$tmp" && cat "$tmp" > "$ex"
      rm -f "$tmp"
    fi
    # A file that does not end in a newline gets one first. Appending to
    # `…node_modules/` with no trailing newline welded the marker onto the
    # developer's last rule — `node_modules/# hostshift (ddev add-on) — begin` —
    # which stopped ignoring node_modules, defeated the idempotency guard (the
    # welded line is not an exact match, so every later install appended another
    # whole block), and made removal impossible, since none of its three paths
    # can find a marker that is not on a line of its own.
    if [ -s "$ex" ] && [ -n "$(tail -c 1 "$ex")" ]; then
      echo "" >> "$ex"
    fi
    {
      echo '# hostshift (ddev add-on) — begin'
      echo '.ddev/**/*hostshift*'
      echo '.ddev/.env'
      # `ddev hostshift wp-cli` writes this, its own header says not to commit
      # it, and the README calls it gitignored — and nothing ignored it. Under
      # production-canonical it carries the *production* URL, so committing it
      # points every teammate's `ddev wp` at the live site.
      echo 'wp-cli.local.yml'
      echo '# hostshift (ddev add-on) — end'
    } >> "$ex"

project_files:
  - config.hostshift.yaml
  - docker-compose.hostshift.yaml
  - docker-compose.hostshift-loopback.yaml
  - commands/host/hostshift

post_install_actions:
  # DDEV tests #ddev-generated on the file *already on disk*, not on the one it
  # is installing. Every project that installed before the marker was added
  # therefore keeps its old command while the compose file and the hook beside
  # it are refreshed — and the three files pass state between them, so they
  # disagree. `ddev add-on get` prints one NOT-overwriting line among many and
  # exits 0, which is not enough to notice.
  #
  # This is the only moment anything can say so.
  - |
    #ddev-nodisplay
    # post_install_actions run with cwd = <project>/.ddev, not the project root.
    # Pathing this as .ddev/commands/... made the test fail always, so the warning
    # fired on every install including the first.
    if ! head -5 commands/host/hostshift 2>/dev/null | grep -q '#ddev-generated'; then
      echo
      echo "hostshift: .ddev/commands/host/hostshift predates this add-on and was NOT"
      echo "  updated — DDEV will not overwrite a file without a #ddev-generated marker,"
      echo "  and older versions of that file had none. The compose file beside it *was*"
      echo "  updated, and the two pass variables between them — the compose file still"
      echo "  reads the old names for one release, so this works for now and stops"
      echo "  working when that goes."
      echo
      echo "  Delete it and install again:"
      echo "      rm .ddev/commands/host/hostshift && ddev add-on get <path-to>/hostshift/ddev"
      echo
    fi
  - |
    #ddev-nodisplay
    # One command, because both files it writes are derived from the same map
    # and neither is a decision anyone needs to make. It is not run for you: it
    # writes into .ddev/, and an add-on that edits a project's configuration
    # without being asked is how a surprise gets installed.
    echo
    echo "hostshift installed. One step remains:"
    echo
    echo "    ddev hostshift init"
    echo
    echo "It works out the slug from the git branch and merges the HOSTSHIFT_*"
    echo "variables into .ddev/.env — the only file it writes. Then"
    echo "'ddev restart', which prints the URLs it is serving. Pass --dry-run"
    echo "first to see what it would write, or --slug to name it yourself."
    echo
    echo "Two things it cannot do for you:"
    echo
    echo "  * If the database holds production hostnames, generate the WP-CLI"
    echo "    override — without it every 'ddev wp' on a multisite fails to"
    echo "    resolve a site:  ddev hostshift wp-cli > wp-cli.local.yml"
    echo
    echo "  * And list that site's production hostnames in"
    echo "    .ddev/docker-compose.hostshift-loopback.yaml, or WordPress's"
    echo "    internal requests (wp-cron, Site Health) leave the machine for"
    echo "    live production. That file has no generated-file marker, so your"
    echo "    edit survives the next 'ddev add-on get'."
    echo
    echo "'ddev hostshift init --dry-run' shows what it would write, and"
    echo "'ddev hostshift check' says whether what is deployed is still current."
    echo "Use those rather than 'hostshift check' directly: in a worktree the"
    echo "bare command resolves this checkout's own hostnames, not the ones the"
    echo "database holds, and reports that map as valid."
    echo

removal_actions:
  - |
    #ddev-nodisplay
    common="$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null || true)"
    [ -n "$common" ] || exit 0
    ex="$common/info/exclude"
    [ -f "$ex" ] || exit 0
    # Only when no other checkout of this repository still has the add-on.
    #
    # info/exclude is shared by the repository and all its linked worktrees —
    # which is the property that makes one write cover them all on install, and
    # exactly what made removal reach too far. Removing the add-on from one
    # worktree un-ignored .ddev/config.hostshift.yaml, the host command and
    # .ddev/.env in the *parent and every other worktree*, where it is still
    # installed and running, with nothing printed. The next `git add -A` over
    # there commits the add-on's files and .ddev/.env, which is where DDEV
    # documents putting project env vars, credentials included. The install is
    # idempotent-guarded, so it does not come back on its own either.
    #
    # `git worktree list --porcelain` names every checkout, this one included;
    # the block stays while any *other* one still has the command installed.
    # A path that is not there any more counts as still installed.
    #
    # `git worktree list` reports the *recorded* path, and a plain `mv` of a
    # worktree directory leaves that stale — git marks the entry prunable and
    # says nothing, while ddev and hostshift both go on working from the new
    # location. Probing the stale path found no command, counted the worktree as
    # gone, and stripped the block while it was still installed and running:
    # .ddev/.env — DDEV's documented home for credentials — became committable
    # by the next `git add -A`, which is the exact harm this guard exists to
    # prevent. The same for a worktree on an unmounted volume, or one restored
    # to a different path.
    #
    # So the asymmetry decides it: a stale ignore entry is harmless, and an
    # un-ignored .ddev/.env is not. When the answer is unknowable, keep it.
    others=0
    here="$(git rev-parse --show-toplevel 2>/dev/null || true)"
    while read -r k v; do
      [ "$k" = "worktree" ] || continue
      [ "$v" = "$here" ] && continue
      if [ ! -d "$v" ] || [ -f "$v/.ddev/commands/host/hostshift" ]; then
        others=$((others + 1))
      fi
    done <<EOT
    $(git worktree list --porcelain 2>/dev/null || true)
    EOT
    if [ "$others" -gt 0 ]; then
      echo "note: $others other checkout(s) of this repository still have hostshift" >&2
      echo "installed, so .git/info/exclude keeps ignoring its files for them." >&2
      exit 0
    fi
    # Delete the delimited range, not every line that looks like ours.
    #
    # `grep -vxF '.ddev/.env'` removed the developer's own rule too, and both
    # pilot repos had written that line by hand before this add-on existed. sed
    # between the markers takes back exactly what install appended.
    #
    # The awk fallback handles a block written by a version that had no end
    # marker; there, matching the patterns is all there is to go on.
    tmp="$(mktemp)"
    ok=""
    # Both markers, or neither. `sed` with an unmatched end address deletes from
    # the begin marker to end of file, so a block whose end marker had been
    # hand-deleted emptied the developer's whole exclude file — silently, exit 0.
    if grep -qxF '# hostshift (ddev add-on) — begin' "$ex" &&
       grep -qxF '# hostshift (ddev add-on) — end' "$ex"; then
      sed '/^# hostshift (ddev add-on) — begin$/,/^# hostshift (ddev add-on) — end$/d' \
        "$ex" > "$tmp" && ok=1
    elif grep -qxF '# hostshift (ddev add-on) — begin' "$ex"; then
      # A begin marker with no end: take the marker and the contiguous run of
      # our own patterns, and leave everything else alone. Deleting to end of
      # file, which is what sed does with an unmatched end address, emptied the
      # developer's whole exclude file.
      awk '
        $0 == "# hostshift (ddev add-on) — begin" { drop = 1; next }
        drop && ($0 == ".ddev/**/*hostshift*" || $0 == ".ddev/.env" || $0 == "wp-cli.local.yml") { next }
        { drop = 0; print }
      ' "$ex" > "$tmp" && ok=1
    else
      # The same contiguous-run rule as the migration, for a block written by a
      # version that had no markers at all. Not `grep -vxF`: that removes every
      # matching line anywhere in the file, which takes the developer's own
      # `.ddev/.env` rule with it — and, as a bare statement returning 1 when it
      # selects nothing, it aborted this whole action under `set -eu -o
      # pipefail`, so the block survived, the temp file leaked, and the farewell
      # action never ran. awk always exits 0 here.
      awk '
        $0 == "# hostshift (ddev add-on)" { drop = 1; next }
        drop && ($0 == ".ddev/**/*hostshift*" || $0 == ".ddev/.env" || $0 == "wp-cli.local.yml") { next }
        { drop = 0; print }
      ' "$ex" > "$tmp" && ok=1
    fi
    # The *status*, not the size. An empty result is correct when the block was
    # the whole file, so testing `-s "$tmp"` left the block behind in exactly
    # that case — while a genuinely failed filter must not be allowed to blank
    # the developer's other rules.
    if [ -n "$ok" ]; then
      cat "$tmp" > "$ex"
    fi
    rm -f "$tmp"
  - |
    #ddev-nodisplay
    # Everything DDEV does not take away itself. docker-compose.hostshift-loopback.yaml
    # carries no #ddev-generated marker — deliberately, since `ddev hostshift
    # loopback` writes it per project — so `add-on remove` leaves it, and a
    # loopback file left behind goes on pinning production hostnames to 127.0.0.1
    # inside web after the thing that needed it is gone. The HOSTSHIFT_ block in
    # .ddev/.env is inert once the compose service is gone, but it is still this
    # add-on's litter in the developer's project file.
    # Paths relative to .ddev/, which is the cwd DDEV runs these actions in —
    # documented at post_install_actions above, and got wrong here, which made
    # this whole list dead on every removal. `..` is the project root.
    left=""
    [ -f docker-compose.hostshift-loopback.yaml ] && left="$left
      .ddev/docker-compose.hostshift-loopback.yaml — pins production hostnames to 127.0.0.1 in web"
    grep -qs '^HOSTSHIFT_' .env && left="$left
      the HOSTSHIFT_ lines in .ddev/.env"
    [ -f ../wp-cli.local.yml ] && left="$left
      wp-cli.local.yml — it carries the canonical URL \`ddev wp\` defaults to"
    true
    # The hostnames go back to web, and that is not always harmless.
    #
    # docker-compose.hostshift.yaml is what narrowed web's VIRTUAL_HOST to this
    # project's own hostnames. With it gone, a worktree's web re-registers every
    # hostname it inherited verbatim from the tracked config.yaml — a multisite's
    # blog hostnames included — and wins the router's tie against the parent, so
    # the parent's second blog is served by the worktree's code and database.
    # `init` prints a note about this hazard at the moment it *creates* it;
    # removal is the moment that re-creates it and said nothing. The parent's own
    # `check` cannot notice by construction: it scans siblings for variant
    # collisions, never for web hostnames.
    # `..` is the project root: these actions run with cwd <project>/.ddev, and
    # a linked worktree's `.git` is a *file* there rather than a directory.
    inherited=""
    if [ -f ../.git ] && grep -qs '^HOSTSHIFT_WEB_HOSTS=.' .env; then
      inherited=1
    fi

    echo "hostshift removed."
    if [ -n "$inherited" ]; then
      echo "Note: this is a linked worktree, and the add-on was what kept the"
      echo "hostnames it inherits from the parent's config.yaml off its web"
      echo "container. They go back now, and the router prefers this project for"
      echo "any it shares with the parent — so a hostname you expect to reach the"
      echo "parent may reach this worktree instead. \`ddev stop\` here, or drop the"
      echo "inherited hostnames from this worktree's DDEV config."
    fi
    [ -n "$left" ] && echo "These are yours to delete:$left"
    true
