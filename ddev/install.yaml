name: hostshift

# Serve a site from a hostname other than the one in its database, without
# rewriting the database.
#
# The add-on is a compose service, the loopback override, and one host command.
# The command is where the DDEV- and stack-shaped opinions live — deriving a slug
# from a branch, deciding which hostnames web keeps, writing .ddev/ files — so
# that the binary can stay a general origin mapper that scaffolds nothing.
# PLAN §5.7. There are still no hooks and no guard.

pre_install_actions:
  - |
    #ddev-nodisplay
    if ! command -v hostshift >/dev/null 2>&1; then
      echo "note: the hostshift CLI is not on PATH." >&2
      echo "The proxy itself runs from the container image, so the add-on works" >&2
      echo "without it, but 'ddev hostshift' and 'hostshift map|check|diff' need it." >&2
    fi

# Ignore what this add-on installs, in the checkout rather than in a commit.
#
# A .gitignore block is *branch*-scoped: adopt hostshift on one branch and every
# pre-existing branch still shows the add-on's files as untracked, which is where
# `git add -A` commits them. $GIT_COMMON_DIR/info/exclude is checkout-scoped,
# which is the right scope for machine-local tool files, and it is shared by a
# repository and all its linked worktrees — so one write covers them all, on
# every branch, and the repo commits nothing.
#
# Deliberately not the root hostshift.yaml, which is a project's own committed
# statement about its hostnames.
  - |
    #ddev-nodisplay
    # `|| true` inside the substitution: DDEV runs actions under `set -eu -o
    # pipefail`, git rev-parse exits 128 outside a repository, and the assignment
    # inherits that — which aborted the whole install and left the project with
    # nothing, in any .ddev project that is not a git checkout.
    common="$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null || true)"
    [ -n "$common" ] || exit 0
    ex="$common/info/exclude"
    [ -d "$(dirname "$ex")" ] || exit 0
    grep -qxF '# hostshift (ddev add-on)' "$ex" 2>/dev/null && exit 0
    {
      echo '# hostshift (ddev add-on)'
      echo '.ddev/**/*hostshift*'
      echo '.ddev/.env'
    } >> "$ex"

project_files:
  - config.hostshift.yaml
  - docker-compose.hostshift.yaml
  - docker-compose.hostshift-loopback.yaml
  - commands/host/hostshift

post_install_actions:
  # DDEV tests #ddev-generated on the file *already on disk*, not on the one it
  # is installing. Every project that installed before the marker was added
  # therefore keeps its old command while the compose file and the hook beside
  # it are refreshed — and the three files pass state between them, so they
  # disagree. `ddev add-on get` prints one NOT-overwriting line among many and
  # exits 0, which is not enough to notice.
  #
  # This is the only moment anything can say so.
  - |
    #ddev-nodisplay
    # post_install_actions run with cwd = <project>/.ddev, not the project root.
    # Pathing this as .ddev/commands/... made the test fail always, so the warning
    # fired on every install including the first.
    if ! head -5 commands/host/hostshift 2>/dev/null | grep -q '#ddev-generated'; then
      echo
      echo "hostshift: .ddev/commands/host/hostshift predates this add-on and was NOT"
      echo "  updated — DDEV will not overwrite a file without a #ddev-generated marker,"
      echo "  and older versions of that file had none. The compose file beside it *was*"
      echo "  updated, and the two pass variables between them — the compose file still"
      echo "  reads the old names for one release, so this works for now and stops"
      echo "  working when that goes."
      echo
      echo "  Delete it and install again:"
      echo "      rm .ddev/commands/host/hostshift && ddev add-on get generoi/hostshift"
      echo
    fi
  - |
    #ddev-nodisplay
    # One command, because both files it writes are derived from the same map
    # and neither is a decision anyone needs to make. It is not run for you: it
    # writes into .ddev/, and an add-on that edits a project's configuration
    # without being asked is how a surprise gets installed.
    echo
    echo "hostshift installed. One step remains:"
    echo
    echo "    ddev hostshift init"
    echo
    echo "It works out the slug from the git branch and merges the HOSTSHIFT_*"
    echo "variables into .ddev/.env — the only file it writes. Then"
    echo "'ddev restart', which prints the URLs it is serving. Pass --dry-run"
    echo "first to see what it would write, or --slug to name it yourself."
    echo
    echo "Two things it cannot do for you:"
    echo
    echo "  * If the database holds production hostnames, generate the WP-CLI"
    echo "    override — without it every 'ddev wp' on a multisite fails to"
    echo "    resolve a site:  ddev hostshift wp-cli > wp-cli.local.yml"
    echo
    echo "  * And list that site's production hostnames in"
    echo "    .ddev/docker-compose.hostshift-loopback.yaml, or WordPress's"
    echo "    internal requests (wp-cron, Site Health) leave the machine for"
    echo "    live production. That file has no generated-file marker, so your"
    echo "    edit survives the next 'ddev add-on get'."
    echo
    echo "'ddev hostshift init --dry-run' shows what it would write, and"
    echo "'ddev hostshift check' says whether what is deployed is still current."
    echo "Use those rather than 'hostshift check' directly: in a worktree the"
    echo "bare command resolves this checkout's own hostnames, not the ones the"
    echo "database holds, and reports that map as valid."
    echo

removal_actions:
  - |
    #ddev-nodisplay
    common="$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null || true)"
    [ -n "$common" ] || exit 0
    ex="$common/info/exclude"
    [ -f "$ex" ] || exit 0
    # Only when no other checkout of this repository still has the add-on.
    #
    # info/exclude is shared by the repository and all its linked worktrees —
    # which is the property that makes one write cover them all on install, and
    # exactly what made removal reach too far. Removing the add-on from one
    # worktree un-ignored .ddev/config.hostshift.yaml, the host command and
    # .ddev/.env in the *parent and every other worktree*, where it is still
    # installed and running, with nothing printed. The next `git add -A` over
    # there commits the add-on's files and .ddev/.env, which is where DDEV
    # documents putting project env vars, credentials included. The install is
    # idempotent-guarded, so it does not come back on its own either.
    #
    # `git worktree list --porcelain` names every checkout, this one included;
    # the block stays while any *other* one still has the command installed.
    others=0
    here="$(git rev-parse --show-toplevel 2>/dev/null || true)"
    while read -r k v; do
      [ "$k" = "worktree" ] || continue
      [ "$v" = "$here" ] && continue
      [ -f "$v/.ddev/commands/host/hostshift" ] && others=$((others + 1)) || true
    done <<EOT
    $(git worktree list --porcelain 2>/dev/null || true)
    EOT
    if [ "$others" -gt 0 ]; then
      echo "note: $others other checkout(s) of this repository still have hostshift" >&2
      echo "installed, so .git/info/exclude keeps ignoring its files for them." >&2
      exit 0
    fi
    tmp="$(mktemp)"
    grep -vxF -e '# hostshift (ddev add-on)' -e '.ddev/**/*hostshift*' -e '.ddev/.env' \
      "$ex" > "$tmp" && cat "$tmp" > "$ex"
    rm -f "$tmp"
  - |
    #ddev-nodisplay
    echo "hostshift removed. wp-cli.local.yml, if you generated one, is yours to delete."
