#ddev-generated
# hostshift — the whole DDEV add-on.
#
# One compose service, and one host command beside it. No lib.sh, no hooks, no
# guard; nothing runs during a request. What the command writes is two files
# DDEV's own .ddev/.gitignore already covers, plus wp-cli.local.yml, which is
# gitignored fleet-wide. PLAN §3's constraint is near-zero per-repo footprint,
# and 42 repos carrying 14 different pinned SHAs of .claude/agency is what
# happens when that is not held to.
#
# Routing is DDEV's router's job and it already does it. The router reaches a
# service through VIRTUAL_HOST / HTTP_EXPOSE / HTTPS_EXPOSE and the com.ddev.*
# labels — the same mechanism the phpmyadmin add-on uses. Pointing the *variant*
# hostnames at this service rather than at `web` needs nothing more than naming
# them here (PLAN §5.6).
#
# VIRTUAL_HOST is the whole registration. DDEV builds the mkcert SAN list from
# the project's hostnames *plus every VIRTUAL_HOST entry across all compose
# services* (pkg/ddevapp/traefik.go, detectAppRouting), so naming the variants
# here both routes them and gets them a certificate. Measured on v1.25.2 with no
# hostshift config file on disk: the served cert carried a SAN for a three-label
# variant host that was never registered anywhere, verified against the mkcert
# root. Nothing needs writing into additional_hostnames.
#
# Substitutions DDEV performs: $DDEV_SITENAME, $DDEV_APPROOT, $DDEV_TLD.
# HOSTSHIFT_VARIANTS and HOSTSHIFT_SLUG come from the project's .ddev/.env.

services:
  # DDEV puts *every* hostname the project registers on web's VIRTUAL_HOST. A
  # worktree inherits the tracked config.yaml's additional_hostnames, so web
  # claims the canonical hostnames of the checkout this worktree came from —
  # which the parent project is already serving. Narrowing web's list back to
  # its own hostnames is what stops the two projects fighting over them.
  #
  # The default is every hostname the project has, which is what DDEV would have
  # done on its own. Without it, installing the add-on and not yet configuring it
  # left web with an *empty* VIRTUAL_HOST — the canonical site, mailpit and
  # `ddev launch` all stopped routing, on a project where nothing had been asked
  # of hostshift yet. An add-on has to be inert until it is configured.
  web:
    environment:
      VIRTUAL_HOST: ${HOSTSHIFT_WEB_HOSTS:-$DDEV_HOSTNAME}

  hostshift:
    container_name: ddev-${DDEV_SITENAME}-hostshift
    image: ghcr.io/generoi/hostshift:latest
    restart: "no"
    command:
      - proxy
      - -C
      - /project
      - --listen
      - 0.0.0.0:8080
      - --upstream
      - http://web:80
      - --slug
      - ${HOSTSHIFT_SLUG:-wt}
      # The canonical hostnames live in the checkout this worktree branched
      # from, which is not mounted here and cannot be. `ddev hostshift init`
      # resolves them on the host and passes them through. Empty is no map, and
      # then -C /project applies — which is right when the project has a
      # hostshift.yaml, since that file *is* mounted.
      - --map
      - ${HOSTSHIFT_MAP:-}
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      # The hostnames the router should send here. Everything else keeps going
      # to `web`, so the canonical site stays reachable alongside the variant.
      VIRTUAL_HOST: ${HOSTSHIFT_VARIANTS}
      # external:internal. hostshift listens plain on 8080 and never terminates
      # TLS; DDEV's router does that, as it does for `web`.
      HTTP_EXPOSE: 80:8080
      HTTPS_EXPOSE: 443:8080
    expose:
      - "8080"
    volumes:
      # Read-only, and only for hostshift.yaml and .ddev/config.yaml — the two
      # files §5.3's config layering reads.
      #
      # $DDEV_APPROOT, not ".": a docker-compose.*.yaml in .ddev/ resolves
      # relative paths against .ddev/, so "." would mount the config directory
      # and hostshift would find neither file.
      - "${DDEV_APPROOT}:/project:ro"
    depends_on:
      - web
    networks: [default, ddev_default]

networks:
  ddev_default:
    name: ddev_default
    external: true
